name: Python kata checks

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "tests/**"
      - ".github/workflows/python-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "tests/**"
      - ".github/workflows/python-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python kata
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
